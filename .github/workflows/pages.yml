name: Collect and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      initialize_creators:
        description: 'Initialize supplementary creator archives'
        type: boolean
        default: false
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize supplementary archives when requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_creators }}
        run: |
          python -m pip install yt-dlp==2026.10.26
          python scripts/backfill.py --game wuthering-waves --creator 1
          python scripts/backfill.py --game zenless-zone-zero --creator 1
          python scripts/backfill.py --game neverness-to-everness --creator 1
      - name: Verify and collect public RSS feeds
        run: |
          node --test scripts/dedupe.test.mjs scripts/github-sync.test.mjs
          python -m unittest discover -s scripts -p rss_test.py
          node scripts/collect.mjs
      - name: Prepare public files only
        run: |
          mkdir public
          cp index.html style.css app.js dedupe.mjs github-sync.mjs config.json public/
          cp -r data public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
